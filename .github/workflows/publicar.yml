# Compila el frontend de React y lo publica en GitHub Pages.
#
# Pages sirve archivos tal cual: no compila nada por su cuenta. Antes la
# pagina era un index.html suelto y por eso funcionaba sin esto; con React
# hay que construir primero, y de eso se encarga este flujo en cada push.
name: Publicar la página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos cambios seguidos, se publica el último y se cancela el
# anterior en vez de encolarlos.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # `npm run build` corre `tsc -b` primero, asi que un error de tipos
      # detiene la publicacion en lugar de subir una pagina rota.
      - run: npm run build
        working-directory: frontend

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
