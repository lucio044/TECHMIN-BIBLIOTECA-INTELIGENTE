[pytest]
# `pythonpath = .` agrega la raíz del proyecto a sys.path, así los imports
# `from techmind_nlp...` de las pruebas funcionan sin instalar el paquete y sin
# depender de desde qué carpeta se invoque pytest. Requiere pytest >= 7
# (el proyecto fija 8.2.0 en requirements.txt).
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -v
