[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techmind-nlp"
version = "1.0.0"
description = "Procesamiento de texto de TechMind: limpieza, tokenización y extracción de términos"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scikit-learn>=1.8.0",
    "joblib>=1.3.0",
]

# Se empaqueta para que la API pueda importarlo en lugar de copiar sus
# archivos. Antes usaba imports `from src...`, que no es un nombre de
# paquete instalable: dos proyectos con esa convención chocan entre sí.
[tool.setuptools]
packages = ["techmind_nlp"]
